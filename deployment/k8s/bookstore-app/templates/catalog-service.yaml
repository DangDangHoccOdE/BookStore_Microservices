apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  labels:
    {{- include "bookstore.labels" . | nindent 4 }}
    service: catalog-service
spec:
  replicas: {{ .Values.catalogService.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      service: catalog-service
  template:
    metadata:
      labels:
        service: catalog-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: {{ .Values.catalogService.port | quote }}
    spec:
      containers:
        - name: catalog-service
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.global.imageUsername }}/bookstore-catalog-service:{{ .Values.catalogService.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy | default "Always" }}
          ports:
            - containerPort: {{ .Values.catalogService.port }}
          env:
            - name: DB_URL
              value: "{{ .Values.catalogService.dbUrl }}"
            - name: JWT_REQUIRED_AUDIENCE
              value: "catalog-service-api"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookstore-secrets
                  key: database-password
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: {{ .Values.lifecycle.timeoutPerShutdownPhase | quote }}
            - name: SERVER_SHUTDOWN
              value: "graceful"
          envFrom:
            - configMapRef:
                name: bookstore-configmap
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ .Values.lifecycle.preStopSleepSeconds }}"]
          resources:
            {{- toYaml .Values.catalogService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.catalogService.port }}
            initialDelaySeconds: 180
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.catalogService.port }}
            initialDelaySeconds: 180
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
spec:
  ports:
    - port: {{ .Values.catalogService.port }}
      targetPort: {{ .Values.catalogService.port }}
  selector:
    service: catalog-service