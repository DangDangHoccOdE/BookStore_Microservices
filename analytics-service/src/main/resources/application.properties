spring.application.name=analytics-service

server.port=8085
server.shutdown=graceful
server.tomcat.threads.max=50

##### Actuator Configuration #####
management.info.git.mode=full
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.tracing.enabled=false
management.tracing.sampling.probability=1.0

######## Database Configuration ########
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

######## Kafka Consumer Configuration ########
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:analytics-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.bookstore.analytics.events.OrderCreatedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.bookstore.analytics.events
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.listener.ack-mode=record

######## Kafka Producer Configuration For Retry/DLT ########
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.spring.json.add.type.headers=false

######## Analytics Kafka Topics ########
analytics.kafka.order-events-topic=${ORDER_EVENTS_TOPIC:order.events}

######## Kafka Failure Simulation ########
analytics.kafka.failure-simulation-enabled=${KAFKA_FAILURE_SIMULATION_ENABLED:false}
analytics.kafka.failure-event-id=${KAFKA_FAILURE_EVENT_ID:step9-duplicate-001}
analytics.kafka.transient-failure-event-id=${KAFKA_TRANSIENT_FAILURE_EVENT_ID:step15-transient-001}
analytics.kafka.permanent-failure-event-id=${KAFKA_PERMANENT_FAILURE_EVENT_ID:step15-poison-001}

logging.pattern.level="%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"

######## Security Configuration ########
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:9191/realms/bookstore}
security.jwt.required-audience=${JWT_REQUIRED_AUDIENCE:analytics-service-api}

######## Swagger Configuration ########
swagger.api-gateway-url=${API_GATEWAY_URL:http://localhost:8989/analytics}
services.keycloak.client-id=${KEYCLOAK_API_CLIENT_ID:user-service-admin}
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true