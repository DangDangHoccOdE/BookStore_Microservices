name: Analytics-service

on:
  push:
    paths:
      - analytics-service/**
    branches:
      - 'main'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      working-directory: ./analytics-service
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/bookstore-analytics-service
    defaults:
      run:
        working-directory: ${{ env.working-directory }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw -ntp verify

      - name: Set image tag
        if: ${{ github.ref == 'refs/heads/main' }}
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Build and Publish Docker Image
        run: |
          ./mvnw spring-boot:build-image -DskipTests -DdockerImageTag=${{ env.IMAGE_TAG }}
          docker tag ${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ env.DOCKER_IMAGE_NAME }}:latest
          docker push ${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKER_IMAGE_NAME }}:latest

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Update Image Tag in Git & Push (GitOps Flow)
        working-directory: .
        run: |
          # Cài đặt cấu hình Git Bot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Dùng yq để ghi đè giá trị imageTag của riêng analyticsService trong file values-prod.yaml
          yq -i '.analyticsService.imageTag = "${{ env.IMAGE_TAG }}"' deployment/k8s/bookstore-app/values-prod.yaml
          
          # Commit và Push thay đổi lên Git ( Vì argoCD chỉ theo doi file values-prod.yaml nên chỉ cần commit file này )
          git add deployment/k8s/bookstore-app/values-prod.yaml
          git commit -m "image(gitops): update analytics-service image tag to ${{ env.IMAGE_TAG }} [skip ci]"
          git push
        
