name: API Gateway

on:
  push:
    paths:
      - api-gateway/**
    branches:
      - 'main'
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: gitops-values-prod-update
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      working-directory: ./api-gateway
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/bookstore-api-gateway
    defaults:
      run:
        working-directory: ${{ env.working-directory }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw -ntp verify

      - name: Set image tag
        if: ${{ github.ref == 'refs/heads/main' }}
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Build and Publish Docker Image
        run: |
          ./mvnw spring-boot:build-image -DskipTests -DdockerImageTag=${{ env.IMAGE_TAG }}
          docker tag ${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ env.DOCKER_IMAGE_NAME }}:latest
          docker push ${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKER_IMAGE_NAME }}:latest

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Update Image Tag in Git & Push (GitOps Flow)
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MAX_RETRY=5
          for i in $(seq 1 $MAX_RETRY); do
            echo "== Attempt $i/$MAX_RETRY =="

            git fetch origin main
            git reset --hard origin/main

            yq -i '.apiGateway.imageTag = "${{ env.IMAGE_TAG }}"' deployment/k8s/bookstore-app/values-prod.yaml
            git add deployment/k8s/bookstore-app/values-prod.yaml

            if git diff --cached --quiet; then
              echo "Không có thay đổi để commit, dừng lại."
              break
            fi

            git commit -m "image(gitops): update api-gateway image tag to ${{ env.IMAGE_TAG }} [skip ci]"

            if git push origin main; then
              echo "Push thành công ở lần thử $i"
              exit 0
            fi

            echo "Push bị reject, thử lại sau $((i * 3))s..."
            sleep $((i * 3))
          done

          echo "Push thất bại sau $MAX_RETRY lần thử"
          exit 1
